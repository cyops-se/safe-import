version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /si-engine/ui
    schedule:
      interval: weekly
    ignore:
      # Major upgrades of the UI framework require a migration (Vue 3 / Vuetify 3)
      - dependency-name: vue
        update-types: ["version-update:semver-major"]
      - dependency-name: vuetify
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-router
        update-types: ["version-update:semver-major"]
      - dependency-name: vuex
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
