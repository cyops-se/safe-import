# NATS server configuration for safe-import.
#
# Every component has its own user and may only publish/subscribe to the subjects it needs.
# This limits what a compromised component (in particular si-outer, which talks to the
# Internet) can do on the message bus.
#
# Passwords are read from environment variables, see deploy/.env.example. Generate them with
#   openssl rand -base64 32
# For TLS, uncomment the tls block and set NATS_CA on the clients.

port: 4222
max_payload: 8MB

# tls {
#   cert_file: "/etc/nats/certs/server.pem"
#   key_file:  "/etc/nats/certs/server.key"
#   ca_file:   "/etc/nats/certs/ca.pem"
#   verify:    true   # require client certificates (NATS_CERT/NATS_KEY)
# }

# Subjects used by all components
COMMON_PUB: ["log.>", "trace.>", "system.>"]
COMMON_SUB: ["system.heartbeat", "_INBOX.>"]

authorization {
  users: [
    {
      # Administration UI: calls all services and forwards all messages to the UI
      user: si-engine
      password: $NATS_PASSWORD_ENGINE
      permissions: {
        publish: { allow: ["log.>", "trace.>", "system.>", "_INBOX.>",
                           "methods.1.si-inner.>", "methods.1.si-outer.>", "methods.1.si-gatekeeper.>"] }
        subscribe: { allow: [">"] }
      }
    },
    {
      # Inner side: may ONLY ask the gatekeeper for files, never si-outer directly
      user: si-inner
      password: $NATS_PASSWORD_INNER
      permissions: {
        publish: { allow: ["log.>", "trace.>", "system.>",
                           "events.1.si-inner.>", "data.1.si-inner.>",
                           "methods.1.si-gatekeeper.proxy.httpget"] }
        subscribe: { allow: ["system.heartbeat", "_INBOX.>", "methods.1.si-inner.>", "data.1.si-outer.jobs.>"] }
        allow_responses: true
      }
    },
    {
      # Gatekeeper: asks si-outer to download, scans, and hands over to the inner side
      user: si-gatekeeper
      password: $NATS_PASSWORD_GATEKEEPER
      permissions: {
        publish: { allow: ["log.>", "trace.>", "system.>", "file.>",
                           "events.1.si-gatekeeper.>", "data.1.si-gatekeeper.>",
                           "methods.1.si-outer.jobs.requesturlwait"] }
        subscribe: { allow: ["system.heartbeat", "_INBOX.>", "methods.1.si-gatekeeper.>"] }
        allow_responses: true
      }
    },
    {
      # Outer side (least trusted, talks to the Internet). It currently needs to look up
      # repository definitions in si-inner (repos.byid); nothing else on the inner side.
      user: si-outer
      password: $NATS_PASSWORD_OUTER
      permissions: {
        publish: { allow: ["log.>", "trace.>", "system.>",
                           "events.1.si-outer.>", "data.1.si-outer.>",
                           "methods.1.si-inner.repos.byid"] }
        subscribe: { allow: ["system.heartbeat", "_INBOX.>", "methods.1.si-outer.>"] }
        allow_responses: true
      }
    }
  ]
}
